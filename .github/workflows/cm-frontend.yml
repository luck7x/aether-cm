name: CM Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cm-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Verify and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix aether-vscodex/web
          npm ci --prefix frontend
      - name: Typecheck
        working-directory: frontend
        run: npm run type-check
      - name: Complete frontend tests
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          AETHER_BUILD_VERSION: cm-${{ github.sha }}
        run: npm run build
      - name: Package verified static files
        run: |
          mkdir -p dist-frontend
          tar -C frontend/dist -czf "dist-frontend/aether-frontend-${GITHUB_SHA}.tar.gz" .
          cd dist-frontend
          sha256sum "aether-frontend-${GITHUB_SHA}.tar.gz" > "aether-frontend-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aether-frontend-${{ github.sha }}
          path: dist-frontend/*
          if-no-files-found: error
          retention-days: 14
