name: CM Build Linux amd64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aether-vscodex/**'
      - 'apps/**'
      - 'crates/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.cm/**'
      - 'CM_README.md'
      - '.github/workflows/cm-build-linux-amd64.yml'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

concurrency:
  group: cm-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: Official full Rust CI
    uses: ./.github/workflows/rust-ci.yml
    with:
      full_scope: true

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json
      - name: Install aether-vscodex web dependencies
        working-directory: aether-vscodex/web
        run: npm ci
      - name: Install Aether frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run type-check
      - name: Run complete frontend test suite
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          AETHER_BUILD_VERSION: cm-${{ github.sha }}
        run: npm run build

  build:
    name: Reproducible Linux amd64 bundle
    needs: [rust-ci, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify pinned Rust toolchain
        run: |
          rustc --version
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake perl pkg-config
      - name: Build release bundle
        env:
          AETHER_BUILD_VERSION: cm-${{ github.sha }}
        run: ./.cm/build-linux-amd64.sh
      - name: Inspect release binary ABI
        run: |
          binary="$(find dist-cm -path '*/bin/aether-gateway' -type f -print -quit)"
          test -n "$binary"
          file "$binary"
          ldd "$binary"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aether-cm-linux-amd64-${{ github.sha }}
          path: |
            dist-cm/*.tar.gz
            dist-cm/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable CM prerelease
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cm-publish-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: aether-cm-linux-amd64-${{ github.sha }}
          path: dist-cm
      - name: Verify release assets before publishing
        run: |
          test "$(find dist-cm -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
          test "$(find dist-cm -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 1
          cd dist-cm
          sha256sum --check ./*.sha256
      - name: Refuse to replace an existing immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/cm-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "tag cm-${GITHUB_SHA} already exists; refusing to move or reuse it" >&2
            exit 1
          fi
          if gh release view "cm-${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release cm-${GITHUB_SHA} already exists; refusing to replace assets" >&2
            exit 1
          fi
      - name: Publish public prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: cm-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Aether CM ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: |
            dist-cm/*.tar.gz
            dist-cm/*.sha256
          fail_on_unmatched_files: true
